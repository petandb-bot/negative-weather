<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111514" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A photograph becomes a temporary sound world." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./style.css?v=0.5.4" />
  <title>NEGATIVE WEATHER — photograph to sound</title>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="brand-eyebrow" aria-hidden="true"><span class="brand-mark"><span></span><span></span><span></span></span></div>
        <h1>NEGATIVE<br /><em>WEATHER</em></h1>
      </div>
    </header>

    <section class="art-frame" id="artFrame" aria-label="Animated photograph">
      <canvas id="art" role="img" aria-label="Animated color photograph with oil-film lens drift and audio-linked motion"></canvas>
      <div class="empty-state" id="emptyState">
        <div class="empty-sigil" aria-hidden="true">◌</div>
        <p>SHOOT OR SELECT A PHOTO</p>
      </div>
      <div class="busy" id="busy" hidden><span class="busy-spinner"></span><span id="busyText">READING LIGHT</span></div>
    </section>

    <section class="readout" aria-live="polite">
      <div class="readout-primary">
        <span class="readout-kicker">ENGINE</span>
        <strong id="conditionLabel">—</strong>
      </div>
      <div class="readout-meta">
        <span id="detailLabel">— BPM</span><span id="durationLabel">LOOP —:—</span>
      </div>
    </section>
    <div class="transport">
      <span class="transport-state" role="status" aria-live="polite"><span id="statusDot" class="status-dot"></span><span id="stageLabel">NO PHOTO</span></span>
      <div class="track" aria-label="Audio loop progress"><span id="progressBar"></span></div>
    </div>

    <section class="controls" aria-label="Main controls">
      <button class="control control-primary" id="shootBtn" type="button"><span class="control-icon">◎</span>SHOOT</button>
      <button class="control" id="mutateBtn" type="button" disabled><span class="control-icon">⟳</span>MUTATE</button>
      <button class="control" id="playBtn" type="button" disabled><span class="control-icon" id="playIcon">▷</span><span id="playText">PLAY</span></button>
      <button class="control" id="saveBtn" type="button" disabled><span class="control-icon">↓</span>SAVE</button>
    </section>

    <div class="footbar">
      <button id="libraryBtn" class="text-button" type="button">↗ USE PHOTO LIBRARY</button>
      <span class="version">v0.5.4</span>
    </div>
    <p class="help" id="helpText" role="alert" hidden></p>
  </main>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
  <input id="libraryInput" type="file" accept="image/*" hidden />

  <div class="modal" id="saveModal" hidden>
    <div class="modal-shade" id="modalShade"></div>
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="Save output">
      <span class="modal-kicker">EXPORT THE WEATHER</span>
      <button type="button" id="saveWavBtn">SOUND <small>WAV / 22.05 KHZ</small></button>
      <button type="button" id="savePngBtn">IMAGE <small>PNG / CURRENT FRAME</small></button>
      <button type="button" id="closeModal" class="modal-close">CANCEL</button>
    </div>
  </div>

  <script src="./audio-engine.js?v=0.5.4"></script>
  <script src="./visual-engine.js?v=0.5.4"></script>
  <script src="./app.js?v=0.5.4"></script>
</body>
</html>
