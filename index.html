<!doctype html>
<html lang="en" data-mode="solar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#c1c8dd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Incident Archive">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Incident Archive — photographic chance engine">
  <title>Incident Archive</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0298">
  <link rel="apple-touch-icon" href="./icons/icon-180.png?v=0298">
  <link rel="stylesheet" href="./style.css?v=0298">
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <div class="wordmark" aria-label="Incident Archive"><span>INCIDENT</span><span>ARCHIVE</span></div>
      <span class="version">0.2.9.8</span>
      <button id="openPhotoTop" class="open-top" type="button" title="Open a photo" aria-label="Open a photo">
        <span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </header>

    <section class="image-world" id="stage" aria-label="Photograph preview">
      <div id="canvasMount" class="canvas-mount"></div>
      <div id="emptyState" class="empty-state">
        <div class="empty-glow" aria-hidden="true"></div>
        <div class="empty-copy"><span class="empty-index">I / A · 029</span><span class="empty-heading">AN IMAGE<br>CAN BECOME<br>AN INCIDENT.</span></div>
        <button id="openPhotoPrimary" class="open-primary" type="button">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 5v18M5 14h18" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>OPEN PHOTO</span>
        </button>
      </div>
      <div id="renderOverlay" class="render-overlay" hidden>
        <span class="activity-indicator"></span><span id="renderLabel">RENDERING</span>
      </div>
    </section>

    <nav class="modes" role="group" aria-label="Photo processing mode">
      <button class="mode active" data-mode="SOLAR" type="button" aria-pressed="true">SOLAR</button>
      <button class="mode" data-mode="CHEMICAL" type="button" aria-pressed="false">CHEMICAL</button>
      <button class="mode" data-mode="REGISTER" type="button" aria-pressed="false">REGISTER</button>
      <button class="mode" data-mode="LEAK" type="button" aria-pressed="false">LEAK</button>
    </nav>

    <div class="photo-meta" aria-label="Photo information">
      <span id="fileMeta">NO IMAGE SELECTED</span>
      <button id="backButton" class="back-button" type="button" disabled>BACK</button>
      <span id="dateMeta">INCIDENT / ARCHIVE</span>
    </div>

    <section class="control-sheet" aria-label="Photo controls">
      <div class="action-row">
        <button id="mutateButton" class="action action-mutate" type="button" aria-label="Mutate photo">
          <svg class="action-icon" viewBox="0 0 80 64" aria-hidden="true">
            <rect x="30" y="6" width="30" height="30" fill="var(--hot-soft)" opacity=".83"/>
            <rect x="18" y="24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>MUTATE</span>
        </button>
        <button id="editToggle" class="action action-edit" type="button" aria-expanded="false" aria-controls="editPanel" aria-label="Toggle edit parameters">
          <svg class="action-icon" viewBox="0 0 80 64" aria-hidden="true">
            <path d="M15 16h50M15 32h50M15 48h50" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <circle cx="36" cy="16" r="5.4" fill="var(--paper)" stroke="currentColor" stroke-width="1.9"/>
            <circle cx="49" cy="32" r="5.4" fill="var(--paper)" stroke="var(--hot)" stroke-width="1.9"/>
            <circle cx="30" cy="48" r="5.4" fill="var(--paper)" stroke="currentColor" stroke-width="1.9"/>
          </svg>
          <span>EDIT <small id="editChevron" aria-hidden="true">+</small></span>
        </button>
        <button id="saveButton" class="action action-save" type="button" disabled aria-label="Save processed photo">
          <svg class="action-icon" viewBox="0 0 80 64" aria-hidden="true">
            <path d="M40 5v36M25 29l15 15 15-15M18 56h44" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"/>
          </svg>
          <span>SAVE</span>
        </button>
      </div>
      <div id="exportReady" class="export-ready" hidden role="status" aria-live="polite">
        <span id="readyStatus" class="export-ready-status">PNG READY</span>
        <div class="export-ready-actions">
          <a id="readyDownload" class="export-ready-link" href="#" download>DOWNLOAD PNG</a>
          <button id="readyShare" class="export-ready-link" type="button" hidden>SHARE / SAVE TO PHOTOS</button>
        </div>
      </div>
      <section id="editPanel" class="edit-panel" hidden>
        <div class="parameter"><div class="parameter-head"><label for="amountSlider">AMOUNT</label><output id="amountValue">88</output></div><input id="amountSlider" type="range" min="0" max="100" value="88" step="1"></div>
        <div class="parameter"><div class="parameter-head"><label for="chanceSlider">CHANCE</label><output id="chanceValue">80</output></div><input id="chanceSlider" type="range" min="0" max="100" value="80" step="1"></div>
        <div class="parameter"><div class="parameter-head"><label for="preserveSlider">PRESERVE</label><output id="preserveValue">22</output></div><input id="preserveSlider" type="range" min="0" max="100" value="22" step="1"></div>
        <div class="export-row"><label for="exportSize">EXPORT SIZE</label><select id="exportSize"><option value="1800">1800 PX</option><option value="2600" selected>2600 PX</option><option value="3200">3200 PX</option></select></div>
      </section>
    </section>

    <div class="footer-bar" aria-hidden="true"><span></span><span></span></div>
    <div class="engine-hooks" aria-hidden="true"><span id="statusText">READY / ADD A PHOTO</span><span id="variationMeta">INCIDENT / —</span></div>
    <div id="errorPanel" class="error-panel" role="alert" hidden><strong>IMAGE ERROR</strong><span id="errorDetail"></span></div>
  </main>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <!-- Independent shader engines; load before main sketch. -->
  <script src="./engines/chemical.js?v=0298"></script>
  <script src="./engines/leak.js?v=0298"></script>
  <script src="./sketch.js?v=0298"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=0298', {updateViaCache:'none'}).catch(console.warn));
    }
  </script>
</body>
</html>
